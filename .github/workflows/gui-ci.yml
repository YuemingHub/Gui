name: gui-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # sessionTruth data-truth tests require node --test --experimental-strip-types
  # (node >= 22.6).
  truth-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (with devDependencies)
        run: npm ci --include=dev

      - name: Data-truth tests
        run: npm test

  # Build gate on node 20 — the same runtime as the Pages deploy pipeline and a
  # combination proven green for this repository.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install (with devDependencies)
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Static export build
        run: npm run build
