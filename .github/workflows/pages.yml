name: Deploy Next.js site to Pages

on:
  workflow_dispatch:
    inputs:
      confirm_public_static_publish:
        description: 'Type PUBLISH to confirm static Pages deploy (no /api on Pages)'
        required: true
        default: 'DO_NOT_PUBLISH'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Publish guard
        run: |
          if [ "${{ github.event.inputs.confirm_public_static_publish }}" != "PUBLISH" ]; then
            echo "Refusing to publish. The Self Space conversation surface requires the"
            echo "Return backend at same-origin /api, which GitHub Pages cannot provide."
            echo "The formal Self Space frontend is served with the Return runtime behind"
            echo "nginx (see DEPLOYMENT.md). Re-run this workflow with"
            echo "confirm_public_static_publish=PUBLISH only for the local-first marketing"
            echo "surface, which must not include the conversation slice."
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
